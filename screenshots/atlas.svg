  </g>
  <text font-family="Georgia,serif" font-size="17" fill="#2b2418"><tspan x="20" y="618">A red supergiant near the end of its life.</tspan><tspan x="20" y="641">One day it will explode. <tspan fill-opacity=".7">The light</tspan></tspan><tspan x="20" y="664" fill-opacity=".7">reaching you left it around 1476.</tspan></text>
  <rect x="20" y="682" width="350" height="62" rx="14" fill="none" stroke="#281e0a" stroke-opacity=".22" stroke-dasharray="4 3"/>
  <text font-size="12" fill="#1e190f" fill-opacity=".62"><tspan x="32" y="704">Position good to about 0.3°. Your compass reports</tspan><tspan x="32" y="721">±6°, so the overlay can sit about that far from</tspan><tspan x="32" y="738">the real star.</tspan></text>
  <rect x="20" y="760" width="98" height="42" rx="14" fill="#2b2418"/><text x="69" y="786" text-anchor="middle" font-size="14" font-weight="600" fill="#f4ecd9">Find it</text>
  <rect x="126" y="760" width="142" height="42" rx="14" fill="#281e0a" fill-opacity=".06" stroke="#281e0a" stroke-opacity=".14"/><text x="197" y="786" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2418">Centre in view</text>
