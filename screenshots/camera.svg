<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 864" width="410" height="864">
<defs>
  <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1024"/><stop offset=".62" stop-color="#1a2446"/><stop offset=".78" stop-color="#3a2e3a"/><stop offset="1" stop-color="#0b0b10"/></linearGradient>
  <clipPath id="scr"><rect x="10" y="10" width="390" height="844" rx="46"/></clipPath>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.2"/></filter>
</defs>
<rect width="410" height="864" rx="56" fill="#111"/>
<g clip-path="url(#scr)">
<g transform="translate(10 10)" font-family="-apple-system,BlinkMacSystemFont,Helvetica,sans-serif">
