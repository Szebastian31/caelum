  <!-- treeline -->
  <path d="M0 640 L0 600 L14 586 L22 604 L34 572 L46 600 L58 580 L70 606 L84 566 L96 598 L110 584 L124 610 L140 590 L156 612 L176 596 L196 616 L220 600 L240 618 L262 592 L276 606 L290 574 L304 602 L318 584 L332 606 L346 568 L360 596 L374 580 L390 600 L390 844 L0 844Z" fill="#05060a"/>

