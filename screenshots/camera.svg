    <circle cx="70" cy="240" r=".5" opacity=".5"/><circle cx="200" cy="200" r=".5" opacity=".5"/><circle cx="260" cy="210" r=".5" opacity=".5"/><circle cx="320" cy="260" r=".5" opacity=".5"/><circle cx="140" cy="480" r=".5" opacity=".5"/><circle cx="240" cy="480" r=".5" opacity=".5"/><circle cx="90" cy="140" r=".5" opacity=".5"/><circle cx="370" cy="330" r=".5" opacity=".5"/>
  </g>
  <g filter="url(#glow)" opacity=".9"><circle cx="160" cy="250" r="5" fill="#ffb08a"/><circle cx="236" cy="372" r="5" fill="#cfe0ff"/><circle cx="196" cy="320" r="3" fill="#cfe0ff"/><circle cx="204" cy="314" r="3" fill="#cfe0ff"/><circle cx="188" cy="326" r="3" fill="#cfe0ff"/></g>
  <g>
    <circle cx="160" cy="250" r="3.2" fill="#ffc6a6"/><circle cx="218" cy="258" r="2.3" fill="#dce8ff"/><circle cx="204" cy="314" r="2" fill="#dce8ff"/><circle cx="196" cy="320" r="2.1" fill="#dce8ff"/><circle cx="188" cy="326" r="2.1" fill="#dce8ff"/><circle cx="174" cy="382" r="2" fill="#dce8ff"/><circle cx="236" cy="372" r="3.3" fill="#e4edff"/>
    <g fill="#ffd0e6" opacity=".55" filter="url(#glow)"><ellipse cx="196" cy="350" rx="5" ry="7"/></g>
