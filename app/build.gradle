plugins {
    id 'com.android.application'
}

android {
    namespace 'com.caelum.sky'
    compileSdk 36

    defaultConfig {
        applicationId "com.caelum.sky"
        minSdk 29
        targetSdk 36
        versionCode 4
        versionName "1.1.1"
    }

    // One fixed key for every build, so a new APK installs over the old one instead of
    // failing with "App not installed". The workflow creates it once and commits it to keystore/.
    signingConfigs {
        caelum {
            storeFile rootProject.file('keystore/caelum.keystore')
            storePassword 'caelum-sky'
            keyAlias 'caelum'
            keyPassword 'caelum-sky'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            if (rootProject.file('keystore/caelum.keystore').exists()) {
                signingConfig signingConfigs.caelum
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The web app at the repo root is the app's interface. It's copied into the APK at build time,
    // so GitHub Pages and the APK always run the same files.
    sourceSets {
        main {
            assets.srcDirs += ["$buildDir/generated/caelum-web"]
        }
    }
}

tasks.register('copyWebApp', Copy) {
    from(rootProject.projectDir) {
        include 'index.html', 'data.js', 'astro.js', 'app.js', 'ui.js', 'camera.js', 'demo.js', 'icons/icon.svg'
    }
    into "$buildDir/generated/caelum-web/www"
}
preBuild.dependsOn copyWebApp

dependencies {
    // serves the bundled web app from a secure https origin inside the WebView,
    // which the motion sensors, camera and location all require
    implementation 'androidx.webkit:webkit:1.11.0'
}
