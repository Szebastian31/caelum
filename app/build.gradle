plugins {
    id 'com.android.application'
}

android {
    namespace 'com.caelum.sky'
    compileSdk 34

    defaultConfig {
        applicationId "com.caelum.sky"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            // debug builds are signed with the auto-generated debug key,
            // which is all that's needed to sideload onto a personal phone.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The web app at the repo root is the app's interface. It's copied into the APK at build time,
    // so GitHub Pages and the APK always run the same files.
    sourceSets {
        main {
            assets.srcDirs += ["$buildDir/generated/caelum-web"]
        }
    }
}

tasks.register('copyWebApp', Copy) {
    from(rootProject.projectDir) {
        include 'index.html', 'data.js', 'astro.js', 'app.js', 'ui.js', 'camera.js', 'icons/icon.svg'
    }
    into "$buildDir/generated/caelum-web/www"
}
preBuild.dependsOn copyWebApp

dependencies {
    // serves the bundled web app from a secure https origin inside the WebView,
    // which the motion sensors, camera and location all require
    implementation 'androidx.webkit:webkit:1.11.0'
}
