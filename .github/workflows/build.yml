name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # the version, release name and APK file name all come from versionName in app/build.gradle
      - name: Read version
        id: ver
        run: echo "name=$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      # Create the signing key on the first run and commit it, so every later APK is signed the same way
      # and installs as an update. [skip ci] stops that commit from starting another build.
      - name: Create signing key (first run only)
        run: |
          if [ ! -f keystore/caelum.keystore ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/caelum.keystore -storetype PKCS12 \
              -storepass caelum-sky -keypass caelum-sky -alias caelum \
              -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Caelum, O=Szebastian31"
            git config user.name "github-actions[bot]"
            git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
            git add keystore/caelum.keystore
            git commit -m "Add Caelum signing key [skip ci]"
            git push
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Caelum_v${{ steps.ver.outputs.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Caelum-v${{ steps.ver.outputs.name }}-apk
          path: Caelum_v${{ steps.ver.outputs.name }}.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Caelum v${{ steps.ver.outputs.name }}
          files: Caelum_v${{ steps.ver.outputs.name }}.apk
          make_latest: true
          body: |
            Download **Caelum_v${{ steps.ver.outputs.name }}.apk** below and open it on your phone to install.
            The camera button opens your phone's own camera app (with its Night mode). Press and hold it for Caelum's night camera, which saves photos to Pictures/Caelum.
